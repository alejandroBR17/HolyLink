<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>HolyLink — Painel de Transmissão & Projeção</title>
    
    <!-- PWA Manifest & Icons -->
    <link rel="manifest" href="/manifest.json?v=11" />
    <link rel="icon" type="image/png" href="/favicon.png?v=11" />
    <link rel="shortcut icon" href="/favicon.png?v=11" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=11" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png?v=11" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png?v=11" />
    
    <!-- Meta Theme & Mobile App -->
    <meta name="theme-color" content="#020617" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="HolyLink" />
    <meta name="application-name" content="HolyLink" />
    <meta name="description" content="Sistema profissional de projeção P2P, cronômetro e transmissão ao vivo para eventos e celebrações." />

    <!-- Cache Busting (Prevents browser from locking index.html) -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <!-- Open Graph / Meta -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="HolyLink — Transmissão & Projeção P2P" />
    <meta property="og:description" content="Controle remoto de telões e slides com sincronização instantânea em tempo real." />
    <meta property="og:image" content="/icon-512.png" />
  </head>
  <body style="background-color: #020617; margin: 0; padding: 0;">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
